name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: flake check (${{ matrix.nixpkgs.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        nixpkgs:
          # The revision pinned in flake.lock.
          - name: pinned
            args: ""
          # The current stable NixOS release. Bump this when a new one comes out.
          - name: nixos-26.05
            args: --override-input nixpkgs github:NixOS/nixpkgs/nixos-26.05
    steps:
      - uses: actions/checkout@v7

      # The NixOS VM test is far too slow without hardware virtualisation.
      - name: Allow the runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      # Lint, package build and the VM test. The package build downloads the
      # installer from ExpressVPN's servers.
      - name: nix flake check
        run: nix flake check --print-build-logs ${{ matrix.nixpkgs.args }}

      - name: Collect the GUI screenshot
        if: success()
        run: |
          nix build .#checks.x86_64-linux.basic ${{ matrix.nixpkgs.args }} --out-link result-basic
          cp result-basic/gui.png "gui-${{ matrix.nixpkgs.name }}.png"

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: gui-${{ matrix.nixpkgs.name }}
          path: gui-${{ matrix.nixpkgs.name }}.png
